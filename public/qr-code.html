<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;justify-content:center;align-items:center;color:#fff;-webkit-font-smoothing:antialiased}
.container{text-align:center;padding:24px;width:100%;max-width:400px}
h1{font-size:28px;font-weight:800;margin-bottom:4px;letter-spacing:-.5px}
.sub{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px}
.qr-wrapper{display:inline-block;background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
#qrcode img,#qrcode canvas{margin:0 auto;display:block}
.url-label{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:6px}
.url-display{font-size:18px;font-weight:700;font-family:monospace;background:rgba(255,255,255,.1);display:inline-block;padding:8px 16px;border-radius:10px;margin-bottom:20px;cursor:pointer;transition:background .2s;user-select:all;-webkit-user-select:all}
.url-display:hover{background:rgba(255,255,255,.15)}
.copy-hint{font-size:12px;color:rgba(255,255,255,.3);margin-bottom:24px}
.instructions{background:rgba(255,255,255,.06);border-radius:12px;padding:16px;text-align:left;font-size:14px;line-height:1.6;color:rgba(255,255,255,.7)}
.instructions strong{color:#fff}
.instructions .step{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.instructions .step:last-child{margin-bottom:0}
.instructions .num{background:#6c63ff;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:2px}
.footer{padding:20px 0 0;font-size:13px;color:rgba(255,255,255,.2)}
@media(max-width:480px){
  h1{font-size:24px}
  .qr-wrapper{padding:16px}
  .url-display{font-size:16px;word-break:break-all}
}
</style>
</head>
<body>
<div class="container">
  <h1>🔔 BUZZ!</h1>
  <div class="sub">Scan to join the game</div>

  <div class="qr-wrapper" id="qrWrapper">
    <div id="qrcode"></div>
  </div>

  <div class="url-label">Game URL</div>
  <div class="url-display" id="gameUrl" onclick="copyUrl()">Loading...</div>
  <div class="copy-hint">Tap the URL to copy</div>

  <div class="instructions">
    <div class="step">
      <span class="num">1</span>
      <span>Open your phone's camera or QR scanner</span>
    </div>
    <div class="step">
      <span class="num">2</span>
      <span>Point at the QR code above</span>
    </div>
    <div class="step">
      <span class="num">3</span>
      <span><strong>Tap</strong> the notification to open the game in your browser</span>
    </div>
  </div>

  <div class="footer">Game Show Buzzer System</div>
</div>

<script>
(function() {
  // Build the game URL from the current page (same host:port as the admin)
  var url = (location.protocol === 'https:' ? 'https:' : 'http:') + '//' + location.host;
  document.getElementById('gameUrl').textContent = url;

  // Generate QR code
  var qrWrapper = document.getElementById('qrcode');
  try {
    new QRCode(qrWrapper, {
      text: url,
      width: 220,
      height: 220,
      colorDark: '#1a1a2e',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  } catch(e) {
    qrWrapper.innerHTML = '<div style="color:#1a1a2e;padding:20px;font-size:14px">⚠️ QR generation failed. Use the URL above.</div>';
  }
})();

function copyUrl() {
  var url = document.getElementById('gameUrl').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function() {
      var hint = document.querySelector('.copy-hint');
      var orig = hint.textContent;
      hint.textContent = '✅ Copied!';
      setTimeout(function() { hint.textContent = orig; }, 2000);
    }).catch(function() {});
  }
}
</script>
</body>
</html>
